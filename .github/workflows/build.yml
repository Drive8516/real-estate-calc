name: Build Windows EXE

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Package with Electron
      run: |
        npx create-electron-app my-app --template=vanilla
        Remove-Item -Recurse -Force my-app/src/*
        Copy-Item index.html my-app/src/index.html
        cd my-app
        npm run make

    - name: Upload EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: RealEstateCalc-Windows-EXE
        path: my-app/out/make/
