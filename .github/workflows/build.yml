name: Build Windows EXE

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download NW.js Runtime
      run: |
        Invoke-WebRequest -Uri "https://dl.nwjs.io/v0.83.0/nwjs-v0.83.0-win-x64.zip" -OutFile "nwjs.zip"
        Expand-Archive -Path "nwjs.zip" -DestinationPath "."
        Rename-Item -Path "nwjs-v0.83.0-win-x64" -NewName "app_build"

    - name: Bundle HTML and Package
      run: |
        Compress-Archive -Path "index.html", "package.json" -DestinationPath "app.nw"
        cmd /c "copy /b app_build\nw.exe+app.nw app_build\不動產坪數與公設試算器.exe"
        Remove-Item "app_build\nw.exe"

    - name: Upload EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: RealEstateCalc-Windows-EXE
        path: app_build/
