name: Build Windows EXE

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Build EXE via NW.js
      run: |
        npm install -g nwjs-builder-bin
        nwbuild --platforms win64 --outDir dist .

    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: RealEstateCalc-Windows-EXE
        path: dist/
